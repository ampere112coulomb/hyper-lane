name: Build iOS installation preview
on:
  workflow_dispatch:
    inputs:
      visual_only:
        description: Skip device packaging while debugging simulator startup
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'
      - name: Record build environment
        run: |
          xcodebuild -version
          dotnet --info
      - name: Install iOS workload
        run: dotnet workload install ios --version 10.0.100
      - name: Build unsigned device app
        if: ${{ !inputs.visual_only }}
        # The existing game icon is resized mechanically by Apple's packaging tool.
        # No user photos or song art are used.
        # Generate before project evaluation so ImageAsset's glob sees the PNG.
        # The next step contains the actual build.
        run: sips -z 1024 1024 assets/hyper-lane-icon.png --out ios/Assets.xcassets/AppIcon.appiconset/icon-1024.png
      - name: Compile unsigned device app
        if: ${{ !inputs.visual_only }}
        run: >-
          dotnet build ios/864beat.iOS.csproj -c Release -r ios-arm64
          -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false
          -p:BuildIpa=false -bl:ios-preview.binlog
          -p:RestoreConfigFile=${{ github.workspace }}/ios/NuGet.Config
      - name: Package for local re-signing
        if: ${{ !inputs.visual_only }}
        shell: bash
        run: |
          set -euo pipefail
          app=$(find ios/bin/Release/net10.0-ios/ios-arm64 -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$app"
          mkdir -p preview/Payload
          cp -R "$app" preview/Payload/
          cd preview
          ditto -c -k --sequesterRsrc --keepParent Payload HyperLane-iOS-Preview-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.visual_only }}
        with:
          name: HyperLane-iOS-Preview-unsigned
          path: preview/HyperLane-iOS-Preview-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build-diagnostics
          path: ios-preview.binlog
          if-no-files-found: ignore
          retention-days: 3
      - name: Build simulator visual check
        run: |
          sips -z 1024 1024 assets/hyper-lane-icon.png --out ios/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          dotnet build ios/864beat.iOS.csproj -c Release -r iossimulator-arm64 -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false -p:BuildIpa=false -p:RestoreConfigFile=${{ github.workspace }}/ios/NuGet.Config
      - name: Capture native iPad screens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-check
          udid=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPad Pro" in x["name"]))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          app=$(find ios/bin/Release/net10.0-ios/iossimulator-arm64 -maxdepth 1 -name '*.app' -type d -print -quit)
          executable="$app/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          # ARM simulators validate executable signatures even without a paid account.
          # This ad-hoc signature is ONLY for the disposable simulator app, not the device IPA.
          # Root-level .NET native dylibs are not necessarily visited by --deep.
          # Give each Mach-O a fresh inode before signing to avoid stale page hashes.
          find "$app" -type f -print0 > visual-check/binaries.list
          while IFS= read -r -d '' binary; do
            if file -b "$binary" | grep -q 'Mach-O'; then
              cp "$binary" "$binary.signing-copy"
              mv "$binary.signing-copy" "$binary"
              if [ "$binary" != "$executable" ]; then
                codesign --force --sign - --timestamp=none "$binary"
                codesign --verify --strict "$binary"
                codesign -dv --verbose=4 "$binary" 2>> visual-check/signatures.log
              fi
            fi
          done < visual-check/binaries.list
          # Sign the main executable exactly once, with the bundle identifier.
          codesign --force --sign - --timestamp=none "$app"
          codesign --verify --deep --strict "$app"
          xcrun simctl install "$udid" "$app"
          failed=0
          for screen in title modes select playing playing-nodepth filter-mono filter-invert filter-mosaic filter-scanline filter-bloom filter-glitch filter-invert-background result settings; do
            SIMCTL_CHILD_HL_VISUAL_QA="$screen" xcrun simctl launch --console "$udid" com.ampere112coulomb.hyperlane.ios > "visual-check/$screen.log" 2>&1 &
            container=$(xcrun simctl get_app_container "$udid" com.ampere112coulomb.hyperlane.ios data)
            for attempt in $(seq 1 24); do
              sleep 2
              if [ -f "$container/Documents/visual-qa/$screen.ready" ]; then break; fi
            done
            sleep 2
            xcrun simctl io "$udid" screenshot "visual-check/$screen.png"
            container=$(xcrun simctl get_app_container "$udid" com.ampere112coulomb.hyperlane.ios data)
            if [ -f "$container/Documents/visual-qa/$screen.ready" ]; then
              cp "$container/Documents/visual-qa/$screen.ready" visual-check/
            else
              echo "No managed screen-ready marker for $screen" >> "visual-check/$screen.log"
              failed=1
            fi
            xcrun simctl terminate "$udid" com.ampere112coulomb.hyperlane.ios || true
            if [ "$failed" -ne 0 ]; then break; fi
          done
          find "$container/Documents/visual-qa" -type f -name 'gpu-*.json' -exec cp {} visual-check/ \; || true
          xcrun simctl spawn "$udid" log show --last 5m --style compact --predicate 'eventMessage CONTAINS[c] "hyperlane" OR eventMessage CONTAINS[c] "signature" OR eventMessage CONTAINS[c] "dyld"' > visual-check/system.log 2>&1 || true
          find "$HOME/Library/Logs/DiagnosticReports" -type f -iname '*hyperlane*' -exec cp {} visual-check/ \; || true
          test "$failed" -eq 0
      - name: Save visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-visual-check
          path: visual-check/
          if-no-files-found: ignore
          retention-days: 3
