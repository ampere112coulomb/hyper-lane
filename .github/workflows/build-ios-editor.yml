name: Build iOS editor
on:
  workflow_dispatch:
    inputs:
      visual_only:
        description: Run simulator checks without rebuilding device IPA
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-editor
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'
      - run: dotnet workload install ios --version 10.0.100
      - name: Prepare editor icon
        run: sips -z 1024 1024 ios-editor/Resources/editor-icon.png --out ios-editor/Assets.xcassets/AppIcon.appiconset/icon-1024.png
      - name: Build unsigned device editor
        if: ${{ !inputs.visual_only }}
        run: >-
          dotnet build ios-editor/HyperLane.Editor.iOS.csproj -c Release -r ios-arm64
          -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false -p:BuildIpa=false
          -p:RestoreConfigFile=${{ github.workspace }}/ios/NuGet.Config -bl:ios-editor.binlog
      - name: Package IPA for local signing
        if: ${{ !inputs.visual_only }}
        shell: bash
        run: |
          set -euo pipefail
          app=$(find ios-editor/bin/Release/net10.0-ios/ios-arm64 -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$app"
          mkdir -p editor-preview/Payload
          cp -R "$app" editor-preview/Payload/
          cd editor-preview
          ditto -c -k --sequesterRsrc --keepParent Payload HyperLane-Editor-iOS-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.visual_only }}
        with:
          name: HyperLane-Editor-iOS-unsigned
          path: editor-preview/HyperLane-Editor-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-editor-build-diagnostics
          path: ios-editor.binlog
          if-no-files-found: ignore
          retention-days: 7
      - name: Build simulator editor
        run: >-
          dotnet build ios-editor/HyperLane.Editor.iOS.csproj -c Release -r iossimulator-arm64
          -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false -p:BuildIpa=false
          -p:RestoreConfigFile=${{ github.workspace }}/ios/NuGet.Config
      - name: Verify native iPad WebKit editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p editor-visual-check
          udid=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPad Pro" in x["name"]))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          app=$(find ios-editor/bin/Release/net10.0-ios/iossimulator-arm64 -maxdepth 1 -name '*.app' -type d -print -quit)
          executable="$app/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          find "$app" -type f -print0 > editor-visual-check/binaries.list
          while IFS= read -r -d '' binary; do
            if file -b "$binary" | grep -q 'Mach-O'; then
              cp "$binary" "$binary.signing-copy"
              mv "$binary.signing-copy" "$binary"
              if [ "$binary" != "$executable" ]; then codesign --force --sign - --timestamp=none "$binary"; fi
            fi
          done < editor-visual-check/binaries.list
          codesign --force --sign - --timestamp=none "$app"
          xcrun simctl install "$udid" "$app"
          for phase in editing filter test; do
            SIMCTL_CHILD_HL_EDITOR_QA="$phase" xcrun simctl launch "$udid" com.ampere112coulomb.hyperlane.editor.ios > "editor-visual-check/$phase.log" 2>&1
            container=$(xcrun simctl get_app_container "$udid" com.ampere112coulomb.hyperlane.editor.ios data)
            marker="$container/Documents/editor-qa/$phase.ready"
            for attempt in $(seq 1 30); do
              sleep 2
              if [ -f "$marker" ]; then break; fi
            done
            xcrun simctl io "$udid" screenshot "editor-visual-check/$phase.png"
            xcrun simctl spawn "$udid" log show --last 3m --style compact --predicate 'process CONTAINS[c] "HyperLane" OR eventMessage CONTAINS[c] "HL Editor" OR eventMessage CONTAINS[c] "signature"' > "editor-visual-check/$phase-system.log" 2>&1 || true
            find "$HOME/Library/Logs/DiagnosticReports" -type f -iname '*hyperlane*' -exec cp {} editor-visual-check/ \; || true
            test -f "$marker"
            cp "$container/Documents/editor-qa/$phase.json" "editor-visual-check/$phase.json"
            python3 -c 'import sys,json; d=json.load(open(sys.argv[1])); print(d); assert d["pass"]' "editor-visual-check/$phase.json"
            xcrun simctl terminate "$udid" com.ampere112coulomb.hyperlane.editor.ios || true
          done
      - name: Save iPad checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-editor-visual-check
          path: editor-visual-check/
          if-no-files-found: ignore
          retention-days: 7
