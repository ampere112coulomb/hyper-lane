<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b20"><meta name="apple-mobile-web-app-capable" content="yes"><title>Hyper Lane Web</title><link rel="icon" href="../hyper-lane-icon.png"><link rel="apple-touch-icon" href="../hyper-lane-icon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body>
<div id="stage"><div class="background"></div><div id="selection-bg"></div><canvas id="particles"></canvas>
<main id="title"><img class="logo" src="../hyper-lane-logo.png" alt="Hyper Lane"><button id="enter">PRESS ANY KEY</button><small class="build">WEB PORT / 開発版</small></main>
<main id="modes" hidden><img class="logo" src="../hyper-lane-logo.png" alt="Hyper Lane"><nav><button data-mode="free">free play</button><button data-mode="dan">Dan mode</button><button data-mode="practice">Practice Mode</button></nav></main>
<main id="select" hidden><div class="left-wall"></div><input id="search" aria-label="曲を検索" placeholder="⌕"><div id="songs"></div><div id="song-details"><img id="jacket" alt="ジャケット" hidden><div id="course-info" hidden></div><p id="best"></p></div><div id="difficulties"></div><p id="support"></p><div class="select-actions"><button id="start">play</button><button id="replay">replay</button><button id="settings" aria-label="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2h4l.8 3 2 1.2 3-.8 2 3.5-2.2 2.2v2.4l2.2 2.2-2 3.5-3-.8-2 1.2L14 22h-4l-.8-2.4-2-1.2-3 .8-2-3.5 2.2-2.2v-2.4L2.2 8.9l2-3.5 3 .8 2-1.2zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8" fill="currentColor" fill-rule="evenodd"/></svg></button></div><button id="import">＋</button><div id="username-badge"></div><p id="catalog-status"></p><button id="demo">動作確認譜面</button></main>
<main id="practice" hidden><canvas id="practice-canvas"></canvas><button id="practice-start">▶</button><label id="beat-label">開始拍 <input id="practice-beat" type="number" min="0" step="0.00390625" value="0"></label><div id="practice-hint">スワイプで移動 / 2本指で拡大・縮小</div></main>
<main id="play" hidden><canvas id="game"></canvas><button id="pause" aria-label="一時停止">Ⅱ</button><button id="restart" hidden>↻</button></main>
<main id="result" hidden><div class="result-wall"></div><div id="result-art"><img id="result-jacket" alt="ジャケット"></div><div id="result-info"></div><div id="result-values"></div><div id="result-rank"><img src="assets/rank_box.png" alt=""><img id="rank-letter" alt="ランク"></div><canvas id="histogram"></canvas><div class="result-actions"><button id="return">曲選択</button><button id="retry">リトライ</button><button id="result-replay">見返す</button></div><p id="save-status"></p><div id="result-name"></div></main>
<main id="dan-result" hidden><h1 id="dan-title"></h1><div id="dan-cards"></div><aside><p id="dan-status"></p><div id="dan-meters"></div><button id="dan-return">段位選択</button><button id="dan-retry">リトライ</button></aside></main>
<button id="back" hidden>←</button><button id="rate" hidden>RATE 0.00</button>
<div id="loading" hidden><img id="loading-jacket" alt="ジャケット"><div id="loading-info"></div><p id="loading-status">読み込み中…</p></div>
<dialog id="name-dialog"><h2>ユーザーネームを設定してください。</h2><p>1～10文字</p><input id="username" maxlength="10" autocomplete="nickname" aria-label="ユーザーネーム"><button id="name-submit">決定</button></dialog>
<dialog id="options"><nav id="settings-tabs"><button data-tab="play">プレイ・音声</button><button data-tab="visual">映像・演出</button><button data-tab="preset">プリセット</button></nav><div id="settings-fields"></div><div id="settings-presets" hidden></div><p>データはこのブラウザに保存します。消去やプライベート閲覧では失われる場合があります。</p><button id="export">データを書き出す</button><button id="import-profile">データを読み込む</button><button id="close-settings">保存して閉じる</button></dialog>
<dialog id="pause-dialog"><button id="resume">再開</button><button id="pause-retry">やり直し</button><button id="pause-settings">設定</button><button id="stop">終了</button></dialog>
<dialog id="import-dialog"><h2>曲・段位を追加</h2><button id="import-zip">ZIPを選ぶ</button><button id="import-folder">フォルダを選ぶ</button><button id="import-files">ファイルを選ぶ</button><p>曲はこの端末にだけ保存されます。iOSでフォルダを選べない場合はZIPまたは複数ファイルを選択してください。登録元フォルダの自動監視はブラウザではできません。更新時は再度読み込んでください。</p><button id="import-close">閉じる</button></dialog>
<dialog id="best30"><h2 id="best30-title"></h2><div id="best30-cards"></div><button id="best30-close">←</button></dialog>
<input id="zip-input" type="file" accept=".zip" hidden><input id="folder-input" type="file" webkitdirectory multiple hidden><input id="files-input" type="file" multiple hidden><input id="profile-input" type="file" accept=".json" hidden>
<p id="notice" role="alert"></p></div><link rel="stylesheet" href="layout.css"><link rel="stylesheet" href="transitions.css"><script type="module" src="app.mjs"></script></body></html>
