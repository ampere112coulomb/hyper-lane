<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b20"><title>Hyper Lane Web — 開発版</title><link rel="icon" href="../hyper-lane-icon.png"><link rel="stylesheet" href="style.css"></head><body>
<div class="background"></div><header><a href="../">←</a><span>WEB / 開発版</span><button id="settings">設定</button></header>
<main id="title"><img src="../hyper-lane-logo.png" alt="Hyper Lane"><button id="enter">PRESS TO START</button><p>Android版を基準に移植中です。まだ完全版ではありません。</p></main>
<main id="select" hidden><section class="list"><h1>FREE PLAY</h1><div id="songs"></div><button id="demo">動作確認譜面</button><p id="catalog-status" role="status"></p><div class="name"><input id="username" maxlength="10" placeholder="ユーザーネーム" aria-label="ユーザーネーム"></div></section><section class="detail"><img id="jacket" alt="ジャケット" hidden><h2 id="song-title">曲を選択</h2><p id="composer"></p><div id="difficulties"></div><p id="best"></p><p id="support"></p><button id="start" disabled>play</button></section></main>
<main id="play" hidden><canvas id="game" aria-label="プレイ画面"></canvas><button id="stop">← 終了</button><div id="hud"></div></main>
<main id="result" hidden><h1>RESULT</h1><h2 id="result-title"></h2><div id="result-values"></div><p id="save-status"></p><button id="return">← 選曲</button></main>
<dialog id="options"><h2>設定</h2><label>音量 <input id="volume" type="range" min="0" max="100"></label><label>ノーツスピード <input id="speed" type="range" min="0.5" max="10" step="0.1"></label><label>譜面補正（ms）<input id="offset" type="number" min="-1000" max="1000"></label><label>AUTO <input id="auto" type="checkbox"></label><p>スコア・設定はこのブラウザに保存します。サイトデータの削除・プライベート閲覧では保持されない場合があります。</p><button id="export">データを書き出す</button><button id="close-settings">閉じる</button></dialog>
<p id="notice" role="alert"></p><script type="module" src="app.mjs"></script></body></html>
